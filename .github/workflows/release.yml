# release.yml — ossature de release (lot B'-a).
#
# COPIE de la convention d'IakaCockpit (M-R6, decidee au cadrage : les deux
# soeurs divergent deja entre elles — voir CONVERGENCE-RELEASE-YML-ALIGNEMENT
# — c'est celle du Cockpit qui est choisie, motif dans l'instruction § 2).
# SOURCE : IakaCockpit/.github/workflows/release.yml
# COMMIT : 8ed1e1a132195ec962e942307db0d7e4be76648c (2026-09-01)
#
# Ce depot n'a PAS de manifeste updater (B'-b, hors perimetre de ce lot) : le
# job `build` ne porte donc AUCUN secret de signature minisign, et
# `includeUpdaterJson` reste a `false` pour la meme raison qu'au Cockpit — un
# manifeste concurrent, non autoritaire, ne doit jamais atterrir sur la
# release (voir le cliquet `fixtures/tauri-action-pin.json`).
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de version a construire (ex. v0.1.0)'
        required: true
      platforms:
        description: 'Plateformes a construire'
        type: choice
        required: true
        default: toutes
        options:
          - toutes
          - windows,linux
          - windows
          - linux
          - macos
      casser:
        # AR-5(a) / CA-R7 — LEVIER DE SABOTAGE VOLONTAIRE, RESERVE AU DECIDEUR (2026-09-05).
        # Seul un run REEL avec un build volontairement casse prouve que la release reste en
        # brouillon (CA-R8) : aucune garde statique ne peut le prouver (elle lit du texte, pas
        # du comportement — § 5.6/CA-R6). Cette entree n'est honoree que sur `workflow_dispatch`
        # (jamais sur un `push` de tag, ou `github.event.inputs.casser` est structurellement
        # vide) — garde par lecture du texte au job `build`, ci-dessous. Le RUN qui l'active est
        # un acte du decideur, jamais de l'agent (AR-5).
        description: 'RESERVE AU DECIDEUR — sabote volontairement une plateforme pour prouver que la release reste en brouillon (AR-5/CA-R8). Inerte hors workflow_dispatch.'
        type: choice
        required: false
        default: aucune
        options:
          - aucune
          - windows
          - linux
          - macos-x64
          - macos-arm64

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      release_id: ${{ steps.brouillon.outputs.release_id }}
    steps:
      - id: set
        run: |
          SEL="${{ github.event.inputs.platforms || 'toutes' }}"
          ALL='[
            {"key":"macos-arm64","platform":"macos-latest","args":"--target aarch64-apple-darwin","rust":"aarch64-apple-darwin"},
            {"key":"macos-x64","platform":"macos-latest","args":"--target x86_64-apple-darwin","rust":"x86_64-apple-darwin"},
            {"key":"linux","platform":"ubuntu-22.04","args":"","rust":""},
            {"key":"windows","platform":"windows-latest","args":"","rust":""}
          ]'
          if [ "$SEL" = "toutes" ]; then
            M=$(echo "$ALL" | jq -c .)
          else
            M=$(echo "$ALL" | jq -c --arg sel "$SEL" \
              '($sel|split(",")) as $s | [ .[] | select( .key as $k | $s | any(. as $x | $k|startswith($x)) ) ]')
          fi
          echo "plateformes retenues : $(echo "$M" | jq -r '[.[].key]|join(", ")')"
          echo "matrix=$M" >> "$GITHUB_OUTPUT"

      # AR-1(a) + AR-2(b), 2026-09-05 — CREATION SERIALISEE DU BROUILLON, UNE SEULE FOIS.
      # Lu au SHA epingle de tauri-action (84b9d35b5fc46c1e45415bdb6144030364f7ebc5,
      # action-v0.6.2) le 2026-09-05 : `src/index.ts:178` (`if (tagName && !releaseId)`) saute
      # ENTIEREMENT la recherche/creation de release des que `releaseId` est fourni au job
      # `build` ci-dessous ; `src/create-release.ts:103-113` (creation) ne passe jamais
      # `make_latest`. Creer le brouillon ICI, une seule fois, dans un job qui ne tourne jamais
      # en parallele avec lui-meme, FERME PAR CONSTRUCTION la course F8
      # (tauri-apps/tauri-action#914 : creation de releases en double sur une matrice
      # concurrente) — les 4 jobs de `build` n'ont plus jamais a chercher ni creer de release,
      # ils ne font qu'y deposer des artefacts via `releaseId`. `releaseId`/`releaseDraft` sont
      # deux entrees DEJA DECLAREES par le SHA epingle (fixtures/tauri-action-pin.json) : rien
      # a desepingler.
      - id: brouillon
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          DEPOT: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ID=$(gh api "repos/$DEPOT/releases" -X POST \
            -f tag_name="$TAG" \
            -f name="$TAG" \
            -f target_commitish="$SHA" \
            -F draft=true \
            -F prerelease=false \
            --jq .id)
          echo "brouillon cree : tag=$TAG id=$ID (repos/$DEPOT/releases, draft=true, prerelease=false)"
          echo "release_id=$ID" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Dependances systeme Linux
        if: matrix.key == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev libasound2-dev cmake pkg-config

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Installer les dependances
        run: npm ci

      # AR-5(a) / CA-R7 — SABOTAGE VOLONTAIRE, RESERVE AU DECIDEUR, AVANT `tauri-action`.
      # Honore UNIQUEMENT sur `workflow_dispatch` (jamais sur un `push` de tag : sur ce
      # declencheur `github.event.inputs.casser` est structurellement vide, la comparaison a
      # `matrix.key` echoue toujours). Place AVANT l'etape ci-dessous : rien n'est televerse
      # pour la plateforme sacrifiee, le brouillon reste incomplet EXACTEMENT comme un vrai
      # build rouge (R8). Le RUN qui active ce levier appartient au decideur (AR-5), jamais a
      # l'agent ; garde statique de cette inertie : scripts/lib/release-publication.mjs.
      - name: Sabotage volontaire (run de preuve reserve au decideur — AR-5/CA-R8)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.casser == matrix.key
        run: |
          echo "::error::sabotage DELIBERE de la plateforme ${{ matrix.key }} (entree 'casser'"
          echo "::error::du workflow_dispatch) — CE N'EST PAS un vrai echec, c'est le run de"
          echo "::error::preuve AR-5/CA-R8 : la release doit rester en brouillon apres ceci."
          exit 1

      # AR-V5(b), 2026-09-05 (amorcage-c3-vitrine-trois-freres.md, etape 0.3 et § 3 AR-V5) —
      # DECLARATION SEULE, AUCUN CABLAGE `env:` SUR L'ETAPE tauri-action CI-DESSOUS.
      #
      # POURQUOI (b) ET PAS (a). Lu au tag @tauri-apps/cli-v2.11.4 (celui que resout
      # package-lock.json de ce depot) : `crates/tauri-bundler/src/bundle/macos/sign.rs:19-44`,
      # `keychain()` entre dans la branche de SIGNATURE des qu'`APPLE_CERTIFICATE` ET
      # `APPLE_CERTIFICATE_PASSWORD` sont TOUTES DEUX PRESENTES (`var_os`, `Some`) dans
      # l'environnement du process enfant — MEME VIDES. Or GitHub Actions pose une variable
      # `env:` referencant un secret ABSENT comme une chaine VIDE mais PRESENTE. Cabler ces deux
      # cles dans un bloc `env:` de l'etape tauri-action, sans que les secrets existent,
      # ferait donc decoder un certificat p12 VIDE puis echouer `security import` — MATRICE 4/4
      # VERTE CASSEE pour une etape decorative (tauri-apps/tauri-action#291, cite au cadrage
      # § 0.4). On ne cable donc RIEN sur l'etape suivante : cette etape-ci se contente de LIRE
      # la presence des secrets via le CONTEXTE GITHUB ACTIONS (`${{ secrets.X }}`, substitue
      # TEXTUELLEMENT avant l'execution du shell — CECI N'ECRIT AUCUNE VARIABLE D'ENVIRONNEMENT
      # dans le process enfant, contrairement a un bloc `env:`), donc SANS le risque mesure
      # ci-dessus. Voir aussi `fixtures/vitrine-locale.json` § `absences_de_signature` et le
      # CLIQUET OFFLINE de `scripts/lib/vitrine.mjs` (`ecartsCliquetSecurite`) : si ce fichier
      # venait un jour a cabler un `env:` APPLE_* actif sur l'etape suivante, ce cliquet force le
      # retrait de la declaration « macos-notarisation » de la vitrine — jamais un silence.
      - name: Notarisation macOS — declaration (AR-V5(b), aucun cablage)
        if: startsWith(matrix.key, 'macos')
        run: |
          if [ -n "${{ secrets.APPLE_CERTIFICATE }}" ] && [ -n "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" ]; then
            echo "notarisation ACTIVE : APPLE_CERTIFICATE et APPLE_CERTIFICATE_PASSWORD sont poses."
            echo "::warning::cette etape ne cable RIEN sur tauri-action — un lot dedie (cablage"
            echo "::warning::env: + rejeu de la matrice) doit le faire avant que ceci ait un effet."
          else
            echo "notarisation SAUTEE — aucun certificat Apple pose dans les reglages du depot."
            echo "voir fixtures/vitrine-locale.json § absences_de_signature (cle macos-notarisation)."
            echo "condition de levee : adhesion Apple Developer Program acquise ET secrets"
            echo "APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD (+ APPLE_ID/APPLE_PASSWORD/"
            echo "APPLE_TEAM_ID ou APPLE_API_*) poses par le decideur dans les reglages du depot —"
            echo "acte refuse aux agents (§ 4 Exclu de l'instruction amorcage-c3-vitrine-trois-freres.md)."
          fi

      # Referent IMMUABLE — cliquet dans fixtures/tauri-action-pin.json (copie
      # de la discipline L41 du Cockpit : le SHA epingle est celui contre
      # lequel les entrees ci-dessous ont ete LUES, jamais un tag deplacable).
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # AR-1(a)+AR-2(b), 2026-09-05 — `releaseId` (sortie de `prepare`, ci-dessus) REMPLACE
          # `tagName`/`releaseName` : au SHA epingle, `src/index.ts:178` saute la recherche/
          # creation de release des que `releaseId` est fourni, `src/index.ts:211` attache
          # directement les artefacts a CET id. Plus aucun des 4 jobs ne cherche ni ne cree de
          # release : la course F8 est fermee par construction, pas seulement geree au job
          # `publier` (qui reste le filet de secours nomme, cf. le job `publier` plus bas).
          releaseId: ${{ needs.prepare.outputs.release_id }}
          # La release existe donc PENDANT les builds, EN BROUILLON : elle recoit les artefacts,
          # aucun visiteur ne la voit (§ 2.1/2.2 de l'instruction RELEASE-PARTIELLE-PUBLIEE).
          # Elle ne devient publique QUE si TOUS les jobs de cette matrice reussissent — voir le
          # job `publier`, `needs: [build]` STRICT, sans `if:` : c'est GitHub lui-meme qui
          # applique la regle (un seul job de matrice en echec suffit a le faire *skipper*),
          # pas une condition ecrite par nous. Ce lot ne touche PAS a `prerelease` (reste
          # `false`, hors perimetre) ni a `includeUpdaterJson` (ci-dessous, inchangee).
          releaseDraft: true
          prerelease: false
          # A ce SHA (action-v0.6.2), `includeUpdaterJson` (defaut 'true') est
          # la SEULE entree qui gouverne la pose d'un manifeste updater
          # concurrent sur la release. Ce depot n'a pas encore de manifeste
          # autoritaire (B'-b) : on la coupe, pour ne rien poser du tout.
          includeUpdaterJson: false
          args: ${{ matrix.args }}

  # AR-1(a), 2026-09-05 — LA RELEASE NE DEVIENT PUBLIQUE QU'APRES LE DERNIER BUILD VERT.
  # `needs: [build]` STRICT, SANS `if:` : par la semantique meme de GitHub Actions (docs
  # *Use jobs in a workflow* : « if a job fails [...] all jobs that need it are skipped unless
  # [...] a conditional expression ») un SEUL job de la matrice en echec suffit a faire
  # *skipper* CE job — c'est la PLATEFORME qui applique la regle, jamais une condition qu'on
  # a ecrite soi-meme (§ 2.2 de `specs/instructions/release-partielle-publiee.md`).
  # Adressage PAR `id`, JAMAIS par tag : `gh release list` n'inclut pas les brouillons
  # (cli/cli#10140), et `gh release edit <tag>` est mal defini sur un brouillon (cli/cli#11589,
  # #5252) — l'API `repos/<depot>/releases` rend le champ `draft` par release, verifie a
  # l'etape 0.7 de ce lot. Un brouillon UNIQUE est attendu pour ce tag (cree par `prepare`,
  # AR-2(b)) : zero = rien a publier (echec nomme), DEUX = la course F8 s'est neanmoins
  # produite (echec nomme aussi — jamais un choix a l'aveugle entre les deux).
  publier:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publier le brouillon (par id, jamais par tag)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          DEPOT: ${{ github.repository }}
        run: |
          set -euo pipefail
          BROUILLONS=$(gh api "repos/$DEPOT/releases" --paginate \
            --jq --arg tag "$TAG" '[.[] | select(.draft == true and .tag_name == $tag)]')
          N=$(echo "$BROUILLONS" | jq 'length')

          if [ "$N" -eq 0 ]; then
            echo "::error::aucun brouillon trouve pour le tag $TAG sur $DEPOT — rien a publier."
            echo "::error::le job 'prepare' a-t-il bien cree le brouillon (etape 'brouillon') ?"
            exit 1
          fi

          if [ "$N" -gt 1 ]; then
            IDS=$(echo "$BROUILLONS" | jq -r '[.[].id] | join(", ")')
            echo "::error::$N brouillons trouves pour le tag $TAG (ids: $IDS)."
            echo "::error::la course F8 (tauri-apps/tauri-action#914) s'est probablement"
            echo "::error::produite malgre la creation serialisee dans 'prepare'. AUCUN des deux"
            echo "::error::n'est publie a l'aveugle : nettoyage MANUEL requis (acte de release,"
            echo "::error::reserve au decideur)."
            exit 1
          fi

          ID=$(echo "$BROUILLONS" | jq -r '.[0].id')
          AVANT=$(gh api "repos/$DEPOT/releases/$ID" --jq '{draft,tag_name,n:(.assets|length)}')
          echo "avant publication : $AVANT"

          gh api -X PATCH "repos/$DEPOT/releases/$ID" -F draft=false > /dev/null

          APRES=$(gh api "repos/$DEPOT/releases/$ID" --jq '{draft,tag_name,n:(.assets|length)}')
          echo "tag publie       : $TAG"
          echo "id de la release : $ID"
          echo "apres publication: $APRES"

  # Le referent est la population des RELEASES (pas des tags) : `GET
  # /releases/latest` ne peut jamais rendre qu'un tag PORTEUR d'une release.
  # `if: always()` : les artefacts sont deja televerses quand ce job demarre,
  # y compris apres un build partiellement rouge — ne pas designer le
  # `latest` dans ce cas laisserait le drapeau au defaut `true` de l'API,
  # c'est-a-dire au hasard de l'ordre de publication. Copie verbatim de la
  # logique d'IakaCockpit (lot L44 la-bas) : elle REPARE (ecrit `--latest` sur
  # le plus haut semver porteur d'une release) mais n'EMPECHE pas le vol (la
  # release est creee avant que ce job ne demarre). Sans release existante,
  # il n'y a rien a designer : il sort en SUCCES en le disant (jamais un
  # silence). Historique complet de la decouverte de ce comportement :
  # IakaCockpit/.github/workflows/release.yml (lots L42 a L44).
  #
  # MIS A JOUR le 2026-09-05 (RELEASE-PARTIELLE-PUBLIEE) — ETAT ANTERIEUR CI-DESSUS CONSERVE,
  # CE QUI LE DEPASSE ET CE QUI NE LE DEPASSE PAS :
  # - `needs` passe de `build` a `publier`. Sans cet ordre, `latest` et `publier` demarreraient
  #   ENSEMBLE : `latest` lirait la release ENCORE BROUILLON (filtree, donc invisible), designerait
  #   l'ancienne version — puis `publier` publierait APRES coup, reprenant le pointeur au defaut
  #   de l'API SANS que personne ne le re-affirme. On aurait fabrique un VOL du `latest` par ce
  #   workflow lui-meme.
  # - `if: always()` EST CONSERVE : ce job doit tourner MEME quand `publier` est *skippe* (matrice
  #   rouge), pour ne pas laisser le pointeur au hasard du defaut de l'API.
  # - CE QUE CECI DEPASSE : la phrase « elle REPARE mais n'EMPECHE pas le vol » ci-dessus decrivait
  #   un `latest` qui voyait une release DEJA publiee par le premier build (avant ce lot). Ce n'est
  #   plus le cas : le referent de ce job filtre deja `select(.draft|not)`, et c'est cette PROPRIETE
  #   qui, combinee a `releaseDraft: true` + `publier` en amont, EMPECHE desormais une matrice rouge
  #   de produire un `latest` visible (§ 2.2 de l'instruction).
  # - CE QUE CECI NE DEPASSE PAS : ce job ne previent TOUJOURS PAS le vol du `latest` par une
  #   release creee A LA MAIN, hors de ce workflow. Sa portee s'arrete a CE workflow (§ 5.3/§ 10).
  latest:
    needs: publier
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Designer explicitement le latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          DEPOT: ${{ github.repository }}
        run: |
          set -euo pipefail
          RELEASES=$(gh api "repos/$DEPOT/releases" --paginate \
            --jq '.[] | select(.draft|not) | select(.prerelease|not) | .tag_name')
          PLUS_HAUT=$(printf '%s\n' "$RELEASES" \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          echo "tag publie      : $TAG"
          echo "plus haut semver: $PLUS_HAUT"

          if [ -z "$PLUS_HAUT" ]; then
            echo "AUCUNE release non-brouillon non-preversion portant un tag de version sur $DEPOT."
            echo "Il n'y a donc AUCUN latest a designer, et rien a verifier. Sortie en SUCCES."
            exit 0
          fi

          if [ "$TAG" = "$PLUS_HAUT" ]; then
            CIBLE="$TAG"
            echo "DECISION : $TAG EST le plus haut semver porteur d'une release -> il est latest."
          else
            CIBLE="$PLUS_HAUT"
            echo "DECISION : $TAG n'est PAS le plus haut ($PLUS_HAUT) -> on RE-AFFIRME --latest sur"
            echo "           $PLUS_HAUT. Sans cette ligne, le defaut make_latest=true de l'API"
            echo "           aurait laisse le latest a $TAG."
          fi

          if ! gh release edit "$CIBLE" --latest --repo "$DEPOT"; then
            echo "::error::impossible de designer le latest sur $CIBLE."
            echo "::error::RATTRAPAGE MANUEL : gh release edit $PLUS_HAUT --latest --repo $DEPOT"
            exit 1
          fi

          EFFECTIF=$(gh api "repos/$DEPOT/releases/latest" --jq '.tag_name')
          echo "VERIFICATION : latest effectif = $EFFECTIF (attendu : $PLUS_HAUT)"
          if [ "$EFFECTIF" != "$PLUS_HAUT" ]; then
            echo "::error::le latest effectif ($EFFECTIF) n'est pas le plus haut semver ($PLUS_HAUT)."
            echo "::error::RATTRAPAGE MANUEL : gh release edit $PLUS_HAUT --latest --repo $DEPOT"
            exit 1
          fi
          echo "latest maitrise : $PLUS_HAUT"
